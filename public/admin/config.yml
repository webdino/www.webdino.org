# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: webdino/www.webdino.org
  squash_merges: true

publish_mode:
  type: preview
  direct_publish: true

i18n:
  structure: multiple_folders
  locales:
    - ja

media_folder: /public/uploads
public_folder: /uploads

asset_collections:
  - name: people
    label: 人物写真
    icon: people
    media_folder: /public/images/people
    public_folder: /images/people
  - name: banners
    label: バナー
    icon: campaign
    media_folder: /public/images/banners
    public_folder: /images/banners

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 8
        width: 1600
        height: 1600
      svg:
        optimize: true

collections:
  - name: authors
    label: 著者
    create: true
    folder: src/content/authors
    i18n: true
    format: yaml
    extension: yaml
    fields:
      - name: title
        label: ハンドルネーム
        hint: 小文字英数字のみ
        widget: string
        i18n: duplicate
      - name: name
        label: 氏名
        hint: 日本語可
        widget: string
        i18n: true
      - name: jobTitle
        label: 肩書
        widget: string
        i18n: true
        required: false
      - name: twitter
        label: X (旧 Twitter) ID
        widget: string
        i18n: true
        required: false
      - name: facebook
        label: Facebook ID
        widget: string
        i18n: true
        required: false
      - name: github
        label: GitHub ID
        widget: string
        i18n: true
        required: false
      - name: image
        label: 写真
        widget: image
        i18n: duplicate_if_empty
        required: false
      - name: description
        label: 自己紹介
        widget: markdown
        i18n: true
        required: false
    editor:
      preview: false
  - name: tags
    label: タグ
    create: true
    folder: src/content/tags
    i18n: true
    format: yaml
    extension: yaml
    fields:
      - name: title
        label: スラッグ
        hint: 小文字英数字のみ
        widget: string
        i18n: duplicate
      - name: name
        label: 名前
        hint: 日本語可
        widget: string
        i18n: true
      - name: description
        label: 説明
        widget: markdown
        i18n: true
        required: false
    editor:
      preview: false
  - name: news
    label: 新着情報
    label_singular: 新着情報記事
    create: true
    folder: src/content/news
    i18n: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}'
    preview_path: /{{locale}}/updates/news/{{slug}}/
    sortable_fields:
      fields:
        - title
        - date
      default:
        field: date
        direction: descending
    fields:
      - name: title
        label: タイトル
        widget: string
        i18n: true
      - name: subtitle
        label: サブタイトル
        widget: string
        i18n: true
        required: false
      - name: date
        label: 公開日
        widget: datetime
        i18n: duplicate
        input_timezone: Asia/Tokyo
      - name: tags
        label: タグ
        widget: relation
        i18n: duplicate
        collection: tags
        value_field: title
        search_fields:
          - title
          - name
        display_fields:
          - name
        multiple: true
      - name: authors
        label: 著者
        widget: relation
        i18n: duplicate
        collection: authors
        value_field: title
        display_fields:
          - name
        required: false
        multiple: true
      - name: image
        label: カバー画像
        widget: image
        i18n: duplicate_if_empty
        required: false
      - name: summary
        label: 要約
        widget: text
        i18n: true
        required: false
      - name: body
        label: 本文
        widget: markdown
        i18n: true
    editor:
      preview: true
